---
# Installs CUDA

- name: Check if nvidia-smi is already functional
  command: nvidia-smi
  register: cuda_smi_check
  changed_when: false
  failed_when: false

- name: Add NVIDIA CUDA network repository keyring
  ansible.builtin.get_url:
    url: "https://developer.download.nvidia.com/compute/cuda/repos/{{ cuda_ubuntu_codename }}/x86_64/cuda-keyring_1.1-1_all.deb"
    dest: /tmp/cuda-keyring.deb
    mode: "0644"
  when: cuda_smi_check.rc != 0

- name: Install NVIDIA CUDA keyring package
  apt:
    deb: /tmp/cuda-keyring.deb
  when: cuda_smi_check.rc != 0

- name: Update apt cache after adding CUDA repo
  apt:
    update_cache: true
  when: cuda_smi_check.rc != 0

- name: Install CUDA drivers and toolkit
  apt:
    name:
      - "cuda-drivers"
      - "cuda-toolkit-{{ cuda_version | replace('.', '-') }}"
    state: present
  when: cuda_smi_check.rc != 0
  register: cuda_installed

- name: Install NVIDIA Container Toolkit repository keyring
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
    mode: "0644"

- name: Add NVIDIA Container Toolkit repository
  apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc]
      https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /
    filename: nvidia-container-toolkit
    state: present

- name: Install NVIDIA Container Toolkit
  apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true

- name: Configure Docker to use NVIDIA runtime
  command: nvidia-ctk runtime configure --runtime=docker
  changed_when: true
  notify: restart docker

- name: Reboot to load the NVIDIA kernel module
  reboot:
    msg: "Rebooting to load NVIDIA kernel module"
    reboot_timeout: 300
  when: cuda_installed is defined and cuda_installed.changed

- name: Verify nvidia-smi works after install
  command: nvidia-smi
  register: cuda_smi_result
  changed_when: false

- name: Print nvidia-smi output
  debug:
    var: cuda_smi_result.stdout_lines
